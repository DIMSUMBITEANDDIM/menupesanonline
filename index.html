<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Online - Bite & Dim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<!-- pb-36 MEMBERIKAN SPASI BAWAH CUKUP BESAR AGAR MENU BAWAH TIDAK TERTUTUP FLOATING KERANJANG -->
<body class="bg-gray-100 min-h-screen text-gray-900 pb-36">

    <!-- HEADER APLIKASI -->
    <div class="bg-amber-500 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🥟</span>
                <div>
                    <h1 class="font-black text-base leading-tight">BITE & DIM</h1>
                    <p class="text-[10px] text-amber-100 font-bold">Pesan Dimsum & Tahu Bakso Online</p>
                </div>
            </div>
            <span id="stok_status" class="text-[10px] bg-amber-600 text-white px-2.5 py-1 rounded-full font-bold">Cek Stok...</span>
        </div>
    </div>

    <!-- UTAMA: DAFTAR MENU -->
    <div class="container mx-auto p-4 max-w-xl space-y-4 mt-2">
        
        <!-- BISA TAMBAH BANNER / INFO -->
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-900 font-medium flex items-center gap-2">
            <span>💡</span>
            <span>Pilih menu kesukaanmu, isi data pemesan, lalu klik <b>Kirim Pesanan</b>!</span>
        </div>

        <!-- KONTAINER KARTU MENU (AKAN DIISI OTOMATIS OLEH JAVASCRIPT) -->
        <div id="kontainer_menu" class="space-y-4"></div>

        <!-- FORM DATA PELANGGAN -->
        <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3 mt-6">
            <h3 class="font-black text-sm text-gray-800 border-b pb-2 flex items-center gap-1.5">
                <span>📝</span> Data Pemesan
            </h3>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nama Lengkap *</label>
                <input type="text" id="pembeli_nama" placeholder="Masukkan nama kamu" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs font-semibold bg-gray-50 focus:bg-white focus:outline-amber-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nomor WhatsApp *</label>
                <input type="tel" id="pembeli_hp" placeholder="Contoh: 081234567890" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs font-semibold bg-gray-50 focus:bg-white focus:outline-amber-500">
            </div>
        </div>

    </div>

    <!-- FLOATING BAR KERANJANG (MELAYANG DI BAWAH) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-2xl z-40">
        <div class="container mx-auto max-w-xl flex justify-between items-center gap-3">
            <div>
                <span class="text-[10px] font-bold text-gray-500 block">Total Pesanan:</span>
                <span id="label_total_harga" class="font-black text-amber-600 text-base">Rp 0</span>
            </div>
            <button id="btn_kirim_pesanan" onclick="kirimPesananOnline()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs px-5 py-3 rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1.5">
                <span>🚀</span> KIRIM PESANAN
            </button>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT KAMU DI SINI:
        const urlWebApp = "https://script.google.com/macros/s/AKfycbxijavfFwCPC4BrH2-hYpZIN2tJuhfN4hmLo9eGRxKCkVnPGZXPF8CtXIqrzsNGUtOqmA/exec";

        let keranjangPembeli = {};
        let stokDapurPcs = { dimsum: 100, tahu: 100 };

        let daftarKartuMenu = [
            {
                namaKartu: "Dimsum Original",
                kategoriBahan: "dimsum",
                temaWarna: "bg-amber-500 text-white",
                items: [
                    { nama: "Dimsum Original", harga: 4000, desc: "Satuan", isiPcs: 1 },
                    { nama: "Paket Hemat", harga: 12000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 20000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 31000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Dimsum Mentai",
                kategoriBahan: "dimsum",
                temaWarna: "bg-orange-500 text-white",
                items: [
                    { nama: "Dimsum Mentai", harga: 5000, desc: "Satuan", isiPcs: 1 },
                    { nama: "Paket Hemat", harga: 15000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 25000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 38000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Dimsum Keju",
                kategoriBahan: "dimsum",
                temaWarna: "bg-yellow-500 text-black",
                items: [
                    { nama: "Dimsum Keju", harga: 5000, desc: "Satuan", isiPcs: 1 },
                    { nama: "Paket Hemat", harga: 15000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 25000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 38000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Dimsum Mix",
                kategoriBahan: "dimsum",
                temaWarna: "bg-teal-600 text-white",
                items: [
                    { nama: "Paket Hemat", harga: 14000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 23000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 35000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Tahu Bakso Goreng",
                kategoriBahan: "tahu",
                temaWarna: "bg-amber-800 text-white",
                items: [
                    { nama: "Box Kecil", harga: 10000, desc: "Isi 10 pcs", isiPcs: 10 },
                    { nama: "Box Besar", harga: 20000, desc: "Isi 20 pcs", isiPcs: 20 }
                ]
            }
        ];

        window.onload = function() {
            ambilStokLive();
            renderMenu();
        };

        function ambilStokLive() {
            fetch(urlWebApp)
                .then(res => res.json())
                .then(resData => {
                    if (resData) {
                        stokDapurPcs.dimsum = parseInt(resData.stokDimsumPcs || 0);
                        stokDapurPcs.tahu = parseInt(resData.stokTahuPcs || 0);
                        document.getElementById("stok_status").innerText = "Stok Terhubung";
                        renderMenu();
                    }
                })
                .catch(e => {
                    document.getElementById("stok_status").innerText = "Offline Mode";
                });
        }

        function renderMenu() {
            let html = "";
            daftarKartuMenu.forEach((kartu, indexKartu) => {
                let sisaPcsBahan = stokDapurPcs[kartu.kategoriBahan] || 0;

                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="${kartu.temaWarna} px-4 py-3 flex justify-between items-center">
                            <h3 class="font-black text-sm tracking-wide">📦 ${kartu.namaKartu}</h3>
                        </div>

                        <div class="p-3 grid grid-cols-1 sm:grid-cols-2 gap-3 border-t border-gray-100">
                `;

                kartu.items.forEach((item, indexItem) => {
                    let keyItem = `${kartu.namaKartu} - ${item.nama}`;
                    let porsiMaksimal = Math.floor(sisaPcsBahan / item.isiPcs);
                    let stokReady = porsiMaksimal > 0;
                    let currentQty = keranjangPembeli[keyItem]?.qty || 0;

                    html += `
                        <div class="border border-gray-100 bg-gray-50/60 rounded-xl p-3 flex flex-col justify-between ${!stokReady ? 'opacity-50' : ''}">
                            <div>
                                <div class="flex justify-between items-start">
                                    <span class="font-extrabold text-xs text-gray-800">${item.nama}</span>
                                    <span class="text-[9px] font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">${item.desc}</span>
                                </div>
                                <div class="mt-1 mb-2">
                                    <span class="font-black text-xs text-amber-600">Rp ${item.harga.toLocaleString('id-ID')}</span>
                                </div>
                            </div>

                            <div class="mt-auto pt-2">
                                ${stokReady ? `
                                    <div class="flex items-center justify-between bg-white border border-gray-300 rounded-lg h-8 px-1">
                                        <button onclick="ubahQty('${keyItem}', ${item.harga}, -1, ${porsiMaksimal})" class="w-7 h-full font-black text-amber-600 active:scale-95 text-sm">-</button>
                                        <span class="font-black text-xs text-gray-800">${currentQty}</span>
                                        <button onclick="ubahQty('${keyItem}', ${item.harga}, 1, ${porsiMaksimal})" class="w-7 h-full font-black text-amber-600 active:scale-95 text-sm">+</button>
                                    </div>
                                ` : `<div class="text-[10px] bg-red-100 text-red-600 font-bold py-1 text-center rounded">HABIS</div>`}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });
            document.getElementById("kontainer_menu").innerHTML = html;
        }

        function ubahQty(keyItem, harga, delta, max) {
            if (!keranjangPembeli[keyItem]) {
                keranjangPembeli[keyItem] = { qty: 0, harga: harga };
            }

            let currentQty = keranjangPembeli[keyItem].qty + delta;

            if (currentQty < 0) currentQty = 0;
            if (currentQty > max) {
                alert(`Maaf, stok hanya cukup untuk ${max} porsi.`);
                currentQty = max;
            }

            keranjangPembeli[keyItem].qty = currentQty;
            if (keranjangPembeli[keyItem].qty === 0) {
                delete keranjangPembeli[keyItem];
            }

            hitungTotal();
            renderMenu();
        }

        function hitungTotal() {
            let total = 0;
            Object.keys(keranjangPembeli).forEach(key => {
                total += keranjangPembeli[key].qty * keranjangPembeli[key].harga;
            });
            document.getElementById("label_total_harga").innerText = "Rp " + total.toLocaleString('id-ID');
            return total;
        }

        function kirimPesananOnline() {
            let totalHarga = hitungTotal();
            if (totalHarga === 0) {
                alert("Silakan pilih minimal 1 menu sebelum mengirim pesanan!");
                return;
            }

            let nama = document.getElementById("pembeli_nama").value.trim();
            let hp = document.getElementById("pembeli_hp").value.trim();

            if (!nama || !hp) {
                alert("Harap isi Nama Lengkap dan Nomor WhatsApp kamu!");
                return;
            }

            let btn = document.getElementById("btn_kirim_pesanan");
            btn.disabled = true;
            btn.classList.add("opacity-50");
            btn.innerHTML = "⏳ Sending...";

            let itemsArray = Object.keys(keranjangPembeli).map(key => ({
                produk: key,
                qty: keranjangPembeli[key].qty,
                subtotal: keranjangPembeli[key].qty * keranjangPembeli[key].harga
            }));

            let payload = {
                action: "onlineOrder",
                namaPelanggan: nama,
                nomorWA: hp,
                items: itemsArray
            };

            fetch(urlWebApp, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(resData => {
                if (resData.status === "success") {
                    alert(`🎉 Pesanan Berhasil Terkirim!\nID Pesanan: ${resData.idPesanan}\n\nSilakan tunggu konfirmasi kasir.`);
                    keranjangPembeli = {};
                    document.getElementById("pembeli_nama").value = "";
                    document.getElementById("pembeli_hp").value = "";
                    hitungTotal();
                    renderMenu();
                } else {
                    alert("Gagal menginput pesanan: " + (resData.message || "Terjadi kesalahan"));
                }
            })
            .catch(err => {
                console.error(err);
                alert("Gagal terhubung ke server. Pastikan koneksi internet stabil!");
            })
            .finally(() => {
                btn.disabled = false;
                btn.classList.remove("opacity-50");
                btn.innerHTML = "<span>🚀</span> KIRIM PESANAN";
            });
        }
    </script>
</body>
</html>
