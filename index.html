<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pemesanan Produk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #007bff;
    }

    .total-box {
      background-color: #eef2f7;
      padding: 12px 16px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #218838;
    }

    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    #notification {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Formulir Pemesanan</h2>
  <form id="orderForm">
    <div class="form-group">
      <label for="namaPelanggan">Nama Lengkap</label>
      <input type="text" id="namaPelanggan" placeholder="Masukkan nama Anda" required>
    </div>

    <div class="form-group">
      <label for="produk">Pilih Produk</label>
      <select id="produk" required onchange="hitungTotal()">
        <option value="" data-harga="0">-- Pilih Produk --</option>
        <option value="Kopi Susu Gula Aren" data-harga="18000">Kopi Susu Gula Aren (Rp 18.000)</option>
        <option value="Matcha Latte" data-harga="22000">Matcha Latte (Rp 22.000)</option>
        <option value="Americano" data-harga="15000">Americano (Rp 15.000)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="jumlah">Jumlah</label>
      <input type="number" id="jumlah" min="1" value="1" required onchange="hitungTotal()" oninput="hitungTotal()">
    </div>

    <div class="total-box">
      <span>Total Bayar:</span>
      <span id="displayTotal">Rp 0</span>
    </div>

    <button type="submit" id="btnSubmit">Kirim Pesanan</button>
  </form>

  <div id="notification"></div>
</div>

<script>
  // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx.../exec";

  function hitungTotal() {
    const selectProduk = document.getElementById("produk");
    const harga = parseFloat(selectProduk.options[selectProduk.selectedIndex].getAttribute("data-harga")) || 0;
    const jumlah = parseInt(document.getElementById("jumlah").value) || 0;
    
    const total = harga * jumlah;
    document.getElementById("displayTotal").innerText = "Rp " + total.toLocaleString("id-ID");
    return total;
  }

  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const btnSubmit = document.getElementById("btnSubmit");
    const notif = document.getElementById("notification");
    
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Mengirim...";
    notif.style.display = "none";

    const selectProduk = document.getElementById("produk");
    
    // Siapkan payload JSON sesuai parameter yang dibutuhkan Google Apps Script
    const payload = {
      namaPelanggan: document.getElementById("namaPelanggan").value,
      produk: selectProduk.value,
      jumlah: parseInt(document.getElementById("jumlah").value),
      totalHarga: hitungTotal()
    };

    // Mengirimkan request ke Google Apps Script via Fetch API
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Digunakan agar browser mengizinkan CORS request ke Apps Script
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      // Karena mode 'no-cors', kita mengasumsikan request berhasil jika sampai di blok ini
      notif.className = "success";
      notif.innerText = "Pesanan berhasil dikirim! Silakan tunggu konfirmasi.";
      notif.style.display = "block";
      
      // Reset Formulir
      document.getElementById("orderForm").reset();
      hitungTotal();
    })
    .catch(error => {
      notif.className = "error";
      notif.innerText = "Gagal mengirim pesanan. Silakan coba lagi.";
      notif.style.display = "block";
      console.error("Error:", error);
    })
    .finally(() => {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Kirim Pesanan";
    });
  });
</script>

</body>
</html>
