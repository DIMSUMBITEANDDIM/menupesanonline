<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Order Online - Bite & Dim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Menyembunyikan elemen bawaan platform Blogger / CMS */
        .post-title, .entry-title, h1.post-title, h1.entry-title,
        #header-wrapper, .header-outer, #sidebar-wrapper, .sidebar-outer, 
        #footer-wrapper, .footer-outer, .tabs-outer, .custom-sidebar {
            display: none !important;
        }

        .efek-cahaya-putih {
            color: #000000 !important;
            text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 15px #ffffff;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-black pb-36 lg:pb-8">

    <!-- 🎯 HEADER BANNER -->
    <div class="w-full bg-amber-500 shadow-md overflow-hidden">
        <img src="https://cdn.phototourl.com/free/2026-07-07-4497e897-0a15-456e-876f-86db9fe2a920.png" alt="Banner Bite & Dim" class="w-full h-auto object-cover block">
    </div>

    <!-- 🍱 LAYOUT UTAMA -->
    <div class="container mx-auto p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-3 gap-5">
        
        <!-- SISI KIRI: DAFTAR KARTU MENU (2 KOLOM DI DEKSTOP) -->
        <div class="lg:col-span-2 space-y-4">
            <h2 class="text-lg font-black text-gray-800 flex items-center gap-2">
                🍽️ Pilih Kartu Menu Favoritmu:
            </h2>

            <!-- KONTAINER KARTU MENU -->
            <div id="kontainer_kartu_menu" class="space-y-4"></div>
        </div>

        <!-- SISI KANAN: KERANJANG BELANJA (STICKY / FIXED MOBILE) -->
        <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-[0_-4px_20px_rgba(0,0,0,0.15)] border-t border-gray-200 z-40 rounded-t-2xl lg:relative lg:bottom-auto lg:left-auto lg:right-auto lg:bg-white lg:shadow-md lg:border lg:border-gray-200 lg:rounded-xl lg:h-fit lg:sticky lg:top-4">
            <h2 class="text-base font-black mb-3 border-b pb-2 hidden lg:block text-black">🛒 Keranjang Belanja</h2>
            
            <div class="flex flex-col lg:block gap-2">
                <!-- Input Nama Pembeli -->
                <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200">
                    <div class="flex items-center lg:block gap-2">
                        <label class="block text-xs font-bold text-gray-700 whitespace-nowrap lg:mb-1">Nama Anda:</label>
                        <input type="text" id="pembeli_nama" placeholder="Masukkan nama (Wajib)" class="w-full border border-gray-300 p-2 rounded-lg text-xs font-semibold bg-white text-black focus:outline-amber-500">
                    </div>
                </div>

                <!-- Rincian Item Keranjang -->
                <div id="elemen_keranjang" class="space-y-2 max-h-[160px] overflow-y-auto border-b pb-2 text-xs">
                    <p class="text-gray-400 text-center text-xs py-2">Keranjang masih kosong, Bro.</p>
                </div>

                <!-- Total & Tombol Checkout -->
                <div class="flex items-center justify-between lg:block mt-2 lg:mt-4">
                    <div class="flex justify-between font-black text-sm lg:text-lg lg:mb-3 gap-2">
                        <span class="text-gray-700 lg:text-black">Total:</span>
                        <span id="total_belanja" class="text-amber-600 font-extrabold">Rp 0</span>
                    </div>

                    <button onclick="prosesOrderPelanggan()" class="w-1/2 lg:w-full bg-green-500 hover:bg-green-600 text-white font-black py-3 rounded-xl text-xs shadow-md cursor-pointer text-center flex items-center justify-center gap-2 transition active:scale-95">
                        💬 PESAN VIA WA
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📥 BANNER DOWNLOAD APP -->
    <div id="banner_download_app" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 w-[92%] sm:w-[440px] p-4 rounded-2xl shadow-2xl z-50 border border-orange-600 flex flex-col items-center justify-between gap-3" style="background-color: #ff6b35 !important;">
        <div class="flex items-center gap-3 w-full">
            <div class="bg-white/30 p-2.5 rounded-xl shrink-0 text-2xl">📲</div>
            <div class="min-w-0 flex-1">
                <h4 class="font-black efek-cahaya-putih text-xl leading-tight">Bite & Dim APK</h4>
                <p class="text-xs font-bold efek-cahaya-putih mt-0.5">Install aplikasi Android resmi agar order lebih gampang!</p>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 w-full border-t border-white/20 pt-2">
            <a href="https://drive.google.com/file/d/1rBOC0omGBK0NxWjnoLeXxZEcPyj_lcqR/view?usp=drive_link" target="_blank" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-black px-5 py-2 rounded-xl text-center no-underline shadow-md">DOWNLOAD</a>
            <button onclick="tutupBannerDownload()" class="text-black hover:text-white font-black text-lg px-2 cursor-pointer">✕</button>
        </div>
    </div>

    <!-- 🧠 SCRIPT LOGIKA APLIKASI -->
    <script>
        const nomorWhatsAppToko = "62887436033472";
        const urlWebApp = "https://script.google.com/macros/s/AKfycbxijavfFwCPC4BrH2-hYpZIN2tJuhfN4hmLo9eGRxKCkVnPGZXPF8CtXIqrzsNGUtOqmA/exec";

        let keranjang = [];
        let totalBelanja = 0;

        // 📌 MASTER DATA KARTU MENU & VARIANKAN SESUAI PERMINTAAN
        const daftarKartuMenu = [
            {
                namaKartu: "Dimsum Original",
                temaWarna: "bg-amber-500 text-white",
                items: [
                    { nama: "Dimsum Original", harga: 4000, desc: "Satuan" },
                    { nama: "Paket Hemat", harga: 12000, desc: "Isi 3 pcs" },
                    { nama: "Paket Kenyang", harga: 20000, desc: "Isi 5 pcs" },
                    { nama: "Paket Ramean", harga: 31000, desc: "Isi 8 pcs" }
                ]
            },
            {
                namaKartu: "Dimsum Mentai",
                temaWarna: "bg-orange-500 text-white",
                items: [
                    { nama: "Dimsum Mentai", harga: 5000, desc: "Satuan" },
                    { nama: "Paket Hemat", harga: 15000, desc: "Isi 3 pcs" },
                    { nama: "Paket Kenyang", harga: 25000, desc: "Isi 5 pcs" },
                    { nama: "Paket Ramean", harga: 38000, desc: "Isi 8 pcs" }
                ]
            },
            {
                namaKartu: "Dimsum Keju",
                temaWarna: "bg-yellow-500 text-black",
                items: [
                    { nama: "Dimsum Keju", harga: 5000, desc: "Satuan" },
                    { nama: "Paket Hemat", harga: 15000, desc: "Isi 3 pcs" },
                    { nama: "Paket Kenyang", harga: 25000, desc: "Isi 5 pcs" },
                    { nama: "Paket Ramean", harga: 38000, desc: "Isi 8 pcs" }
                ]
            },
            {
                namaKartu: "Dimsum Mix",
                temaWarna: "bg-teal-600 text-white",
                items: [
                    { nama: "Paket Hemat", harga: 14000, desc: "Isi 3 pcs" },
                    { nama: "Paket Kenyang", harga: 23000, desc: "Isi 5 pcs" },
                    { nama: "Paket Ramean", harga: 35000, desc: "Isi 8 pcs" }
                ]
            },
            {
                namaKartu: "Tahu Bakso Goreng",
                temaWarna: "bg-amber-800 text-white",
                items: [
                    { nama: "Box Kecil", harga: 10000, desc: "Isi 10 pcs" },
                    { nama: "Box Besar", harga: 20000, desc: "Isi 20 pcs" }
                ]
            }
        ];

        window.onload = function() {
            renderKartuMenu();
            setTimeout(() => {
                document.getElementById("banner_download_app").classList.remove("hidden");
            }, 2500);
        };

        function tutupBannerDownload() {
            document.getElementById("banner_download_app").classList.add("hidden");
        }

        // RENDER 5 KARTU UTAMA DISERTAI VARIANKAN HARGA
        function renderKartuMenu() {
            let html = "";

            daftarKartuMenu.forEach((kartu, indexKartu) => {
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <!-- HEADER KARTU -->
                        <div class="${kartu.temaWarna} px-4 py-3 flex justify-between items-center">
                            <h3 class="font-black text-base tracking-wide">📦 ${kartu.namaKartu}</h3>
                            <span class="text-[11px] font-semibold bg-white/20 px-2 py-0.5 rounded-full">${kartu.items.length} pilihan</span>
                        </div>

                        <!-- DAFTAR ITEM DI DALAM KARTU -->
                        <div class="p-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
                `;

                kartu.items.forEach((item, indexItem) => {
                    let idInput = `qty_${indexKartu}_${indexItem}`;
                    let namaLengkap = `${kartu.namaKartu} - ${item.nama}`;

                    html += `
                        <div class="border border-gray-100 bg-gray-50/50 rounded-xl p-3 flex flex-col justify-between hover:border-amber-300 transition">
                            <div>
                                <div class="flex justify-between items-start gap-1">
                                    <span class="font-extrabold text-xs text-gray-800 block">${item.nama}</span>
                                    <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded shrink-0">${item.desc}</span>
                                </div>
                                <div class="mt-1 mb-3">
                                    <span class="font-black text-sm text-amber-600">Rp ${item.harga.toLocaleString('id-ID')}</span>
                                </div>
                            </div>

                            <!-- TOMBOL STOK & KERANJANG -->
                            <div class="space-y-2 mt-auto">
                                <div class="flex items-center bg-white border border-gray-300 rounded-lg overflow-hidden h-8">
                                    <button onclick="kurangQty('${idInput}')" type="button" class="px-3 h-full text-gray-700 font-black hover:bg-gray-100 text-xs cursor-pointer">-</button>
                                    <input type="number" id="${idInput}" value="1" min="1" readonly class="w-full text-center font-extrabold bg-white text-xs text-black border-none focus:outline-none">
                                    <button onclick="tambahQty('${idInput}')" type="button" class="px-3 h-full text-gray-700 font-black hover:bg-gray-100 text-xs cursor-pointer">+</button>
                                </div>
                                <button onclick="tambahKeKeranjang('${namaLengkap}', ${item.harga}, '${idInput}')" type="button" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-xs py-2 rounded-lg shadow-xs cursor-pointer transition active:scale-95">
                                    + KERANJANG
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            document.getElementById("kontainer_kartu_menu").innerHTML = html;
        }

        function tambahQty(id) {
            let el = document.getElementById(id);
            el.value = parseInt(el.value || 1) + 1;
        }

        function kurangQty(id) {
            let el = document.getElementById(id);
            let val = parseInt(el.value || 1);
            if (val > 1) el.value = val - 1;
        }

        function tambahKeKeranjang(namaItem, harga, idInput) {
            let qty = parseInt(document.getElementById(idInput).value) || 1;
            let idx = keranjang.findIndex(x => x.nama === namaItem);

            if (idx > -1) {
                keranjang[idx].qty += qty;
            } else {
                keranjang.push({ nama: namaItem, harga: harga, qty: qty });
            }

            document.getElementById(idInput).value = 1;
            renderKeranjang();
        }

        function hapusDariKeranjang(index) {
            keranjang.splice(index, 1);
            renderKeranjang();
        }

        function renderKeranjang() {
            let html = "";
            totalBelanja = 0;

            if (keranjang.length === 0) {
                html = `<p class="text-gray-400 text-center text-xs py-2">Keranjang masih kosong, Bro.</p>`;
            } else {
                keranjang.forEach((item, index) => {
                    let subtotal = item.qty * item.harga;
                    totalBelanja += subtotal;

                    html += `
                        <div class="flex justify-between items-center text-xs border-b pb-1.5 pt-1">
                            <div class="truncate max-w-[160px]">
                                <span class="font-bold text-gray-800 block truncate">${item.nama}</span>
                                <span class="text-[10px] text-gray-500">${item.qty} x Rp ${item.harga.toLocaleString('id-ID')}</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="font-extrabold text-gray-800">Rp ${subtotal.toLocaleString('id-ID')}</span>
                                <button onclick="hapusDariKeranjang(${index})" class="text-red-500 hover:text-red-700 font-bold text-xs cursor-pointer">✕</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById("elemen_keranjang").innerHTML = html;
            document.getElementById("total_belanja").innerText = "Rp " + totalBelanja.toLocaleString('id-ID');
        }

        function prosesOrderPelanggan() {
            if (keranjang.length === 0) {
                alert("Keranjang masih kosong, Bro!");
                return;
            }

            let nama = document.getElementById("pembeli_nama").value.trim();
            if (nama === "") {
                alert("Mohon isi Nama Anda terlebih dahulu!");
                return;
            }

            // Simpan Transaksi ke Spreadsheet Apps Script
            let payload = {
                pelanggan: nama + " (Web Order)",
                items: keranjang.map(i => ({ produk: i.nama, qty: i.qty, subtotal: i.qty * i.harga }))
            };
            fetch(urlWebApp, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) }).catch(e => console.log(e));

            // Format Pesan WhatsApp
            let teksWA = `*Halo Admin BITE & DIM, Saya mau order!* 😋\n-------------------------------------------\n*Nama Pelanggan:* ${nama}\n-------------------------------------------\n\n*RINCIAN PESANAN:*\n`;
            
            keranjang.forEach((item, i) => {
                teksWA += `${i + 1}. *${item.nama}*\n      ${item.qty} x Rp ${item.harga.toLocaleString('id-ID')} = *Rp ${(item.qty * item.harga).toLocaleString('id-ID')}*\n`;
            });

            teksWA += `\n*TOTAL BAYAR: Rp ${totalBelanja.toLocaleString('id-ID')}*\n-------------------------------------------\nMohon info nomor rekening / e-wallet untuk pembayarannya ya admin, Terima Kasih!`;

            // Clear Keranjang & Redireksi WA
            keranjang = [];
            renderKeranjang();
            document.getElementById("pembeli_nama").value = "";

            setTimeout(() => {
                window.location.href = `https://wa.me/${nomorWhatsAppToko}?text=${encodeURIComponent(teksWA)}`;
            }, 300);
        }
    </script>
</body>
</html>
